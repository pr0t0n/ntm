<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas CMDB</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
  <script src="/app.js" defer></script>
  <style>
    body { margin: 0; background: var(--color-bg); }
  </style>
</head>
<body>
  <div style="display:flex;min-height:100vh;color:var(--color-text);font-family:var(--font-body);font-variant-numeric:tabular-nums">
    <aside style="width:228px;flex:none;display:flex;flex-direction:column;gap:3px;padding:18px 12px;background:linear-gradient(180deg,var(--color-surface),var(--color-bg) 70%);height:100vh;position:sticky;top:0">
      <div style="display:flex;align-items:center;gap:10px;padding:4px 8px 22px">
        <div style="width:30px;height:30px;border-radius:var(--radius-md);display:grid;place-items:center;border:1px solid var(--color-accent);color:var(--color-accent);box-shadow:0 0 18px color-mix(in srgb,var(--color-accent) 35%,transparent)"><i class="ph ph-graph" style="font-size:17px"></i></div>
        <div style="display:flex;flex-direction:column;line-height:1.2"><span style="font-weight:500;font-size:15px">Atlas CMDB</span><span style="font-size:11px;color:var(--color-neutral-500)">Gestão de ativos</span></div>
      </div>
      <div style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600);padding:0 10px 6px">Plataforma</div>
      <div id="nav"></div>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)">
        <div id="collectorStatus" style="display:flex;align-items:center;gap:8px;font-size:12px"><span style="width:7px;height:7px;border-radius:50%;background:var(--color-accent-400);box-shadow:0 0 8px var(--color-accent)"></span>Coletor —</div>
        <div id="collectorSub" style="font-size:11.5px;color:var(--color-neutral-500);line-height:1.45">—</div>
      </div>
    </aside>

    <main style="flex:1;min-width:0;display:flex;flex-direction:column">
      <header style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 32px 16px">
        <div style="display:flex;flex-direction:column;gap:2px;margin-right:auto">
          <div style="font-size:12px;color:var(--color-neutral-500)">Atlas CMDB / <span id="crumb">Dashboard</span></div>
          <h1 id="title" style="font-size:26px;margin:0">Dashboard</h1>
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-radius:var(--radius-md);background:var(--color-surface);box-shadow:var(--shadow-sm);width:260px;max-width:100%">
          <i class="ph ph-magnifying-glass" style="color:var(--color-neutral-500)"></i>
          <input id="globalSearch" placeholder="Buscar hostname, IP, MAC…" style="flex:1;min-width:0;background:transparent;border:0;color:var(--color-text);font:inherit;font-size:13px;outline:none">
        </div>
        <button class="btn btn-primary" id="goScan"><i class="ph ph-broadcast"></i>Nova varredura</button>
      </header>

      <div style="padding:4px 32px 40px;display:flex;flex-direction:column;gap:18px">
        <div id="screen"></div>
      </div>
    </main>

    <div id="drawer"></div>
  </div>
</body>
</html>
